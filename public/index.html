<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Thea: thoughtful Mother's Day gifts personalized to her — take the 2-min quiz or browse our hand-curated guide."
    />

    <!-- Open Graph: drives link previews on Meta surfaces (FB feed, IG DM/Stories shares, Messenger), Slack, iMessage, etc.
         Single set applied to all routes since this is a SPA — Meta's crawler doesn't run JS so per-route OG variation
         would require server-side rendering or a Cloud Function rewrite. Themed for the Mother's Day campaign. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thea" />
    <meta property="og:title" content="Thea — Personalized Mother's Day Gifts" />
    <meta property="og:description" content="Hand-curated Mother's Day gifts ranked by relationship, age, and interests. Take our 2-minute quiz." />
    <meta property="og:image" content="https://givethea.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="No one looks back and wishes they had celebrated less — Thea Mother's Day Gifts" />
    <meta property="og:url" content="https://givethea.com/" />

    <!-- Twitter / X equivalent (also picked up by some other unfurlers like Slack). -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Thea — Personalized Mother's Day Gifts" />
    <meta name="twitter:description" content="Hand-curated Mother's Day gifts ranked by relationship, age, and interests. Take our 2-minute quiz." />
    <meta name="twitter:image" content="https://givethea.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Oooh+Baby&family=Albert+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,400;1,600;1,700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Oooh+Baby&family=Albert+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@1,400;1,600;1,700&display=swap"></noscript>
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- LCP optimization: preload the first hero scenario's image so the
         browser starts fetching it during HTML parse, before React mounts.
         Must stay in sync with SCENARIO_CARDS[0].productImage. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/landing-assets/gift-tea.jpg" fetchpriority="high" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Thea — Personalized Mother's Day Gifts</title>

    <!-- Pre-mount loading-state CSS. React replaces #root contents on mount, so
         this only renders during the brief window between first HTML paint and
         React's first commit. On a slow mobile webview where the JS bundle
         takes seconds to parse, the user sees a branded "Loading…" screen
         instead of pure-blank-white. -->
    <style>
      #thea-prerender-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #92400e;
        z-index: 1;
      }
      #thea-prerender-loading .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #f3e7d4;
        border-top-color: #92400e;
        border-radius: 50%;
        animation: thea-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      #thea-prerender-loading .label {
        font-size: 14px;
        letter-spacing: 0.04em;
        opacity: 0.7;
      }
      @keyframes thea-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Meta Pixel (no initial PageView — usePageTracking hook handles all PageView fires on route change) -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2511117595971258');
    </script>
    <noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=2511117595971258&ev=PageView&noscript=1" /></noscript>

    <!-- Google Analytics 4 (send_page_view:false — usePageTracking hook owns every page_view fire so SPA route changes are attributed) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KV1K3W6CLJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-KV1K3W6CLJ', { send_page_view: false });
    </script>

    <!-- Eruda in-page debug console — only loaded when ?debug=1 is in the URL.
         Lets us inspect console errors / network / DOM from inside an IG/FB
         in-app browser without a Mac + USB cable + Safari Web Inspector.
         Production users (without ?debug=1) never download Eruda. -->
    <script>
      (function () {
        try {
          if (new URLSearchParams(window.location.search).get('debug') !== '1') return;
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/eruda@3/eruda.min.js';
          s.onload = function () { try { window.eruda && window.eruda.init(); } catch (e) {} };
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="thea-prerender-loading">
        <div class="spinner" aria-hidden="true"></div>
        <div class="label">LOADING THEA</div>
      </div>
    </div>

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
