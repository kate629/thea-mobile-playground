name: Happo

# Triggers chosen so draft PRs never fire the workflow (not even as a
# "Skipped" run). `pull_request.synchronize` and `pull_request.opened`
# fire on drafts too — both are removed. `ready_for_review` only fires
# on the draft → ready transition, so that's the canonical "run Happo"
# moment for a PR. Subsequent pushes to a ready PR don't auto-fire;
# use `workflow_dispatch` (Actions tab → "Run workflow") if you want
# to re-run before merging.
on:
  pull_request:
    types: [ready_for_review, reopened]
    paths-ignore:
      - '.github/**'
      - 'lighthouserc*.json'
      - '**/*.md'
      - '.gitignore'
      - 'firebase.json'
      - '.firebaserc'
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  happo:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx happo --baseBranch origin/master
        env:
          HAPPO_API_KEY: ${{ secrets.HAPPO_API_KEY }}
          HAPPO_API_SECRET: ${{ secrets.HAPPO_API_SECRET }}
