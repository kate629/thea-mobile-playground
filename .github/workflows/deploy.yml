name: Deploy to Firebase Hosting (live)

# Manual-trigger-only production deploy. Run via Actions UI when ready to
# ship a master commit to the live channel of `thea-643b1-23686`.
#
# History: previously triggered automatically on push to master. That
# behavior was removed after an env-var-mismatch incident (see PR #99):
# the auto-deploy was building with a stale REACT_APP_FIREBASE_AUTH_DOMAIN
# secret, which silently broke mobile Google sign-in via Safari ITP /
# Chrome storage partitioning. The break was invisible until users tried
# to sign in, and manual `firebase deploy --only hosting` from a known-
# good local environment was fine — only auto-deploys carried the bug.
#
# Industry best practice for solo / small-team Firebase apps without
# staging + canary + auto-rollback + real-time error tracking is explicit
# human-action deploys. References: DORA 2024 State of DevOps, Google SRE
# Workbook ch. 16 (canarying releases), Firebase Hosting GitHub
# integration docs (recommends preview channels for CI, manual for prod),
# GitHub Actions docs on production environments. Full rationale in the
# launch handoff at:
#   ~/Desktop/thea/onboarding/MOTHERS_DAY_LAUNCH_2026-04-30.md
#
# When to revisit auto-deploy: after staging + post-deploy smoke tests +
# Sentry-equivalent observability are in place. Until then, deploys are
# a deliberate human action.
#
# Setup (one-time, before this workflow can run):
#   1. Generate a service account JSON for Firebase Hosting deploys:
#        firebase init hosting:github
#      (This auto-creates the service account, grants it
#       roles/firebasehosting.admin, and adds the JSON as a repo secret
#       named FIREBASE_SERVICE_ACCOUNT_THEA_643B1.)
#   2. OR, if you already have a service account, paste its JSON into
#      Repo settings → Secrets → Actions → New repository secret named
#      `FIREBASE_SERVICE_ACCOUNT_THEA_643B1`.
#
# To deploy: GitHub → Actions → "Deploy to Firebase Hosting (live)" →
# "Run workflow" → pick branch `master` → Run.
#
# What it does:
#   - Install deps with `npm ci`
#   - Run tests (CI=true)
#   - Run `CI=true npm run build` (warnings-as-errors per project standard)
#   - Verify build/index.html is non-empty
#   - Deploy `build/` to channel `live` of site `thea-643b1-23686`
#
# Per-PR preview deploys (separate from production, still allowed):
#   firebase hosting:channel:deploy <name> --expires 7d

on:
  # Manual-only trigger. Run from Actions UI: pick this workflow, choose
  # branch master, click "Run workflow". No auto-fire on push.
  workflow_dispatch:

# Only one deploy at a time. If a deploy is in-flight and another master
# push lands, the in-flight deploy continues and the new push queues —
# this prevents two deploys racing each other to the same site.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fail fast if no service account is configured (rather than running
    # a 5-minute build only to fail on the deploy step).
    if: ${{ vars.SKIP_DEPLOY != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true
          # SKIP_PREFLIGHT_CHECK avoids react-scripts dependency conflicts
          # in CI (matches local dev pattern).
          SKIP_PREFLIGHT_CHECK: 'true'
          # Firebase config injected at build time via REACT_APP_* env vars
          # (CRA's `process.env.REACT_APP_*` baking pattern). Without these,
          # the build ships with empty config strings, and `initializeApp`
          # crashes at runtime with `auth/invalid-api-key` — which is exactly
          # what happened on the first auto-deploy after PR #89 landed.
          # These six secrets must exist in repo Settings → Secrets:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}

      - name: Verify build output is non-empty
        # Guard against the silent-empty-build failure mode (handbook
        # gotcha: react-scripts can exit 0 without CI=true and leave an
        # empty build/ that deploys as a 404).
        run: |
          test -f build/index.html
          test "$(wc -c < build/index.html)" -gt 1000
          ls build/static/js/main.*.js > /dev/null

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THEA_643B1 }}
          channelId: live
          projectId: thea-643b1
          target: thea-643b1-23686
