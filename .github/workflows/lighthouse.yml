name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          CI: false
        run: npm run build

      - name: Run Lighthouse CI (${{ matrix.preset }}, headless incognito)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.${{ matrix.preset }}.json
          uploadArtifacts: true
          temporaryPublicStorage: true
