name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          CI: false
        run: npm run build

      - name: Install lhci + xvfb
        run: |
          npm install -g @lhci/cli@0.13.x
          sudo apt-get update -qq && sudo apt-get install -yq xvfb

      - name: Run Lighthouse CI (${{ matrix.preset }}) under Xvfb
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" lhci autorun --config=./lighthouserc.${{ matrix.preset }}.json

      - name: Upload Lighthouse artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-${{ matrix.preset }}-reports
          path: .lighthouseci
          if-no-files-found: ignore
