name: E2E

on:
  pull_request:
  push:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e
        env:
          REACT_APP_FIREBASE_API_KEY: dummy
          REACT_APP_FIREBASE_AUTH_DOMAIN: dummy
          REACT_APP_FIREBASE_PROJECT_ID: dummy
          REACT_APP_FIREBASE_STORAGE_BUCKET: dummy
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: dummy
          REACT_APP_FIREBASE_APP_ID: dummy

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
